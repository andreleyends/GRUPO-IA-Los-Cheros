name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sprint3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sprint3/requirements.txt
      - name: Instalar torch (CPU) y dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: pytest
        run: pytest -q -rs

  docker:
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t stylemate:ci .
      - name: Prueba de humo (modo mock, sin datos pesados)
        run: |
          docker run -d --name sm -p 8501:8501 -e STYLEMATE_BACKEND=mock stylemate:ci
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8501/_stcore/health; then echo " <- OK"; exit 0; fi
            sleep 3
          done
          docker logs sm
          exit 1
